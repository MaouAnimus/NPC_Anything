# Perfiles tácticos configurables por rol (RF-07, RF-18, CU-04).
# Modulan los pesos de evaluación de utilidad sin alterar daño ni salud.
roles:
  assault:
    role_name: "Assault"
    description: "Presión frontal agresiva, avance entre coberturas cortas"
    attack_weight: 1.25
    pursue_weight: 1.20
    cover_weight: 0.75
    flank_weight: 0.70
    investigate_weight: 0.90
    critical_health_threshold: 0.25
    preferred_engagement_distance_m: 6.0

  flanker:
    role_name: "Flanker"
    description: "Búsqueda de ángulos abiertos y trayectorias laterales"
    attack_weight: 0.80
    pursue_weight: 0.85
    cover_weight: 1.10
    flank_weight: 1.45
    investigate_weight: 1.00
    critical_health_threshold: 0.40
    preferred_engagement_distance_m: 11.0

  support:
    role_name: "Support"
    description: "Fuego de contención a media distancia y defensa de posiciones aliadas"
    attack_weight: 0.85
    pursue_weight: 0.75
    cover_weight: 1.35
    flank_weight: 0.80
    investigate_weight: 1.00
    critical_health_threshold: 0.50
    preferred_engagement_distance_m: 12.0

  scout:
    role_name: "Scout"
    description: "Detección anticipada, sigilo y transmisión temprana de avisos"
    attack_weight: 0.65
    pursue_weight: 0.80
    cover_weight: 1.15
    flank_weight: 1.10
    investigate_weight: 1.40
    critical_health_threshold: 0.60
    preferred_engagement_distance_m: 16.0

  companion:
    role_name: "Companion"
    description: "Asistencia al jugador: cobertura defensiva sin bloquear paso ni robar objetivos"
    attack_weight: 0.80
    pursue_weight: 0.70
    cover_weight: 1.10
    flank_weight: 0.70
    investigate_weight: 1.00
    critical_health_threshold: 0.40
    preferred_engagement_distance_m: 8.0
